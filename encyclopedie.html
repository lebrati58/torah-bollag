*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}

.brand{font-weight:900;font-size:20px;text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;background:var(--yellow);border-radius:12px;padding:6px 9px;margin-inline-end:8px;display:inline-block}
.lang{display:flex;border:2px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:8px 13px;font-weight:bold;font-size:14px}
.lang button[aria-pressed=true]{background:var(--purple);color:#fff}
nav.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs div{max-width:1150px;margin:auto;padding:8px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-weight:bold;padding:10px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);white-space:nowrap}
nav.tabs a[aria-current=page]{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 0 var(--purple-dk)}
main{max-width:1150px;margin:auto;padding:16px}
section[hidden]{display:none}
section{animation:rise .35s ease}

h1{font-size:clamp(30px,6vw,52px);margin:10px 0 6px;letter-spacing:-1px}
h2{font-size:clamp(22px,4vw,30px);margin:24px 0 10px}
.lead{font-size:19px;line-height:1.8;max-width:680px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.6}
.week{background:linear-gradient(135deg,#ece4ff,#fff3cc);border:2px solid #d7cafa;border-radius:28px;padding:22px;display:grid;gap:14px}
.week .tag{display:inline-block;background:#fff;border-radius:14px;padding:6px 12px;font-weight:bold;font-size:14px}
.cta{display:inline-block;border:0;background:var(--purple);color:#fff;border-radius:16px;padding:14px 22px;font-weight:bold;text-decoration:none;box-shadow:0 5px 0 var(--purple-dk);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:10px}

[dir=rtl] .chip{padding:5px 5px 5px 14px}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.av{width:44px;height:44px;border-radius:50%;background:#e9e3ff;overflow:hidden;display:grid;place-items:center;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 2px #d7cafa}
.av svg{width:100%;height:100%}
.av.lg{width:110px;height:110px}
.av.md{width:64px;height:64px}

.pcard{border:2px solid var(--line);background:#fff;border-radius:24px;padding:16px 12px;text-align:center;box-shadow:0 5px 0 #eee6da;transition:transform .2s}
.pcard:hover{transform:translateY(-5px)}
.pcard .av{margin:0 auto 10px;width:84px;height:84px}
.pcard b{display:block;font-size:22px}
.pcard span{color:var(--muted);font-size:14px}
.pcard.link{opacity:.85;border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;margin:8px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:26px;height:10px;border-radius:6px;display:inline-block}
.tl-wrap{border:2px solid var(--line);background:#fff;border-radius:22px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.tl{position:relative;padding:12px 0 16px}
.axis{position:relative;height:44px;border-bottom:2px solid var(--ink);margin:0 20px}
.tick{position:absolute;bottom:0;transform:translateX(50%);font-size:11px;text-align:center;color:var(--muted);white-space:nowrap}
[dir=ltr] .tick{transform:translateX(-50%)}
.tick::after{content:"";display:block;width:2px;height:7px;background:var(--ink);margin:3px auto 0}
.tick b{display:block;color:var(--ink);font-size:12px}
.lane{position:relative;height:56px;margin:0 20px}
.bar{position:absolute;top:10px;height:36px;border-radius:20px;background:var(--torah-bg);border:2px solid var(--torah);display:flex;align-items:center;gap:6px;padding:0 4px;font-weight:bold;font-size:14px;white-space:nowrap;transition:transform .15s;overflow:visible}
.bar:hover{transform:scale(1.03)}
.bar.mid{background:var(--midrash-bg);border-color:var(--midrash);border-style:dashed}
.bar .av{width:30px;height:30px;box-shadow:none}
.evrow{position:relative;height:30px;margin:0 20px}
.dot{position:absolute;top:6px;width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);transform:translateX(50%);padding:0}
[dir=ltr] .dot{transform:translateX(-50%)}
.undated{margin-top:14px}
.note{background:var(--lilac);border-radius:16px;padding:14px;line-height:1.7}
.tree-wrap{position:relative;border:2px solid var(--line);background:#fff;border-radius:24px;padding:18px 8px;overflow-x:auto}
.tree{position:relative;width:max-content;min-width:100%;padding:0 8px}
.trow{display:flex;justify-content:safe center;gap:34px;margin:0 0 46px;position:relative;z-index:1}
.trow:last-child{margin-bottom:0}
.tgroup{display:flex;gap:12px}
.tnode{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:2px;font-weight:bold;font-size:14px;width:76px}
.tnode .av{width:56px;height:56px}
.tnode.off{opacity:.45}.civ{unicode-bidi:isolate;direction:ltr;display:inline-block}.tnode.cur .av{box-shadow:0 0 0 4px var(--yellow),0 0 0 6px var(--ink)}

dialog::backdrop{background:#211b40c9;backdrop-filter:blur(5px)}
dialog[open]{animation:pop .25s ease}

.ftabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;border-bottom:1px solid var(--line)}

.story{font-size:clamp(19px,3.4vw,23px);line-height:2}

.src.midrash{background:var(--midrash-bg);color:var(--midrash)}

.fam{display:grid;gap:14px}

.fam .chips .chip.self{background:var(--yellow)}

.video b{font-size:22px;display:block;margin:6px 0}
.q{font-size:clamp(20px,3.6vw,24px);font-weight:bold;line-height:1.6;margin:6px 0 14px}

.opt.ok{background:var(--torah-bg);border-color:var(--torah)}
.opt.no{background:#fde4e1;border-color:#c0473a}
.qbar{display:flex;gap:6px;margin-bottom:12px}
.qbar i{flex:1;height:8px;border-radius:5px;background:#e4dbf1}
.qbar i.done{background:var(--purple)}
.stars{font-size:46px;text-align:center;animation:pop .4s}
.feedback{min-height:28px;margin-top:10px;font-weight:bold}
footer{max-width:1150px;margin:30px auto;padding:20px 16px;border-top:1px solid var(--line);font-size:13px;line-height:1.8;color:var(--muted)}
@media(max-width:640px){
  dialog{border-radius:0;height:100dvh;width:100vw}
  .fhead .av.lg{width:80px;height:80px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const nm=c=>c?c[L]:"";
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* Hebrew numerals */
function heNum(n){const o=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],te=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];let s="";if(n>=100){s+="ק";n-=100}let tt=Math.floor(n/10),u=n%10;if(tt===1&&(u===5||u===6)){s+="ט"+o[u+1]}else{s+=te[tt]+o[u]}return s.length>1?s.slice(0,-1)+"״"+s.slice(-1):s+"׳"}
function fmtRef(r){if(!r)return"";const m=r.match(/^(\w+)\.(\d+)\.(\d+)(?:-(\d+)(?:\.(\d+))?)?$/);if(!m)return r;let[,b,ch,v,e1,e2]=m;const B=BOOKS[b]||{he:b,fr:b};
 if(L==="he"){let s="בראשית "+heNum(+ch)+":"+heNum(+v);if(e2)s+="–"+heNum(+e1)+":"+heNum(+e2);else if(e1)s+="–"+heNum(+e1);return s}
 let s=B.fr+" "+ch+","+v;if(e2)s+="–"+e1+","+e2;else if(e1)s+="-"+e1;return s}
const sefaria=r=>"https://www.sefaria.org/"+r.replace(/\.(\d+)-(\d+)\.(\d+)$/,".$1-$2.$3")+"?lang="+(L==="he"?"he":"bi");
function srcBadge(s){if(!s||!D.sources[s])return"";return '<span class="src '+s+'">'+esc(D.sources[s][L])+'</span>'}
function heYear(n){const o=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],te=["","י","כ","ל","מ","נ","ס","ע","פ","צ"],hu=["","ק","ר","ש","ת","תק","תר","תש","תת","תתק"];const th=Math.floor(n/1000);n%=1000;let s=hu[Math.floor(n/100)];n%=100;const tt=Math.floor(n/10),u=n%10;s+=(tt===1&&(u===5||u===6))?"ט"+o[u+1]:te[tt]+o[u];s=s.length>1?s.slice(0,-1)+"״"+s.slice(-1):(s?s+"׳":"");return (th?o[th]+"׳":"")+s}
const yr=am=>L==="he"?heYear(am):String(am);
function civ(am){const y=3761-am;return '<span class="civ" dir="ltr">'+(y>0?"\u2212"+y:String(1-y))+'</span>'}

function silhouette(){return '<svg viewBox="-50 -50 100 145" aria-hidden="true"><circle cy="2" r="28" fill="#cfc4ea"/><path d="M-42 95Q-40 38 0 34Q40 38 42 95Z" fill="#cfc4ea"/></svg>'}
function avatar(c,cls=""){const svg=c&&c.portrait?portraitSVG(c.portrait):null;return '<span class="av '+cls+'"'+(svg?'':' title="'+esc(t("noPortrait"))+'"')+'>'+(svg||silhouette())+'</span>'}

/* relations */
const ids=a=>(a||[]).map(x=>x.id).filter(id=>byId[id]);
function childrenOf(id){return D.characters.filter(c=>(c.parents||[]).some(p=>p.id===id))}
function spousesOf(c){const s=new Set(ids(c.spouses));D.characters.forEach(o=>(o.spouses||[]).forEach(x=>{if(x.id===c.id)s.add(o.id)}));return[...s]}
function siblingsOf(c){const s=new Set(ids(c.siblings));D.characters.forEach(o=>(o.siblings||[]).forEach(x=>{if(x.id===c.id)s.add(o.id)}));
 const ps=ids(c.parents);if(ps.length)D.characters.forEach(o=>{if(o.id!==c.id&&ids(o.parents).some(p=>ps.includes(p)))s.add(o.id)});s.delete(c.id);return[...s]}

/* ---------- sections ---------- */
function latestParasha(){return [...D.parachiot].sort((a,b)=>b.order-a.order)[0]}
function chip(c,self){return '<button class="chip'+(self?' self':'')+'" data-open="'+c.id+'">'+avatar(c)+esc(nm(c))+'</button>'}
function renderWeek(){const p=latestParasha();const cs=D.characters.filter(c=>c.status==="full"&&c.parachiot.includes(p.id));
 $("#s-week").innerHTML='<div class="week"><div><span class="tag">'+esc(t("weekOf"))+' · '+esc(p.book[L])+'</span></div><h1>'+esc(p[L])+'</h1><div class="muted">'+esc(p.ref[L])+'</div><p class="lead">'+esc(p.summary[L])+'</p><div><a class="cta" href="'+esc(p.episodes)+'">'+esc(t("watch"))+'</a></div></div>'+
 '<h2>'+esc(t("meet"))+'</h2><div class="chips">'+cs.map(c=>chip(c)).join("")+'</div><p class="muted small" style="margin-top:18px">'+esc(t("growing"))+'</p>'}

function renderTimeline(){const dated=D.characters.filter(c=>c.life&&c.life.born!=null).sort((a,b)=>a.life.born-b.life.born);
 const evs=[];D.characters.forEach(c=>(c.events||[]).forEach(e=>{if(e.am!=null)evs.push({c,e})}));
 let min=Math.min(...dated.map(c=>c.life.born)),max=Math.max(...dated.map(c=>c.life.died||c.life.born+20));min=Math.floor((min-10)/25)*25;max=Math.ceil((max+10)/25)*25;
 const K=4.2,W=(max-min)*K,side=L==="he"?"right":"left",pos=y=>(y-min)*K;
 let ticks="";for(let y=min;y<=max;y+=25)ticks+='<span class="tick" style="'+side+':'+pos(y)+'px"><b>'+yr(y)+'</b>'+civ(y)+'</span>';
 let lanes=dated.map(c=>{const b=c.life.born,d=c.life.died||b+15,mid=c.life.src==="midrash";return '<div class="lane"><button class="bar'+(mid?' mid':'')+'" data-open="'+c.id+'" style="'+side+':'+pos(b)+'px;width:'+Math.max(64,(d-b)*K)+'px" title="'+esc(nm(c))+' · '+yr(b)+(c.life.died?'–'+yr(c.life.died):'')+'">'+avatar(c)+esc(nm(c))+'</button></div>'}).join("");
 const seen={};let dots=evs.filter(x=>{const k=x.e.am+x.e.he;if(seen[k])return false;return seen[k]=1}).map(x=>'<button class="dot" data-open="'+x.c.id+'" data-tab="story" style="'+side+':'+pos(x.e.am)+'px" title="'+esc(yr(x.e.am)+' · '+nm(x.c)+' — '+x.e[L])+'" aria-label="'+esc(x.e[L])+'"></button>').join("");
 const und=D.characters.filter(c=>c.status==="full"&&(!c.life||c.life.born==null));
 $("#s-timeline").innerHTML='<h1>'+esc(t("tlTitle"))+'</h1><p class="lead">'+esc(t("tlLead"))+'</p><div class="legend"><span><i class="sw" style="background:var(--torah-bg);border:2px solid var(--torah)"></i>'+esc(t("tlTrad"))+'</span><span><i class="sw" style="background:var(--midrash-bg);border:2px dashed var(--midrash)"></i>'+esc(t("tlMid"))+'</span><span><i class="sw" style="background:var(--yellow);border:2px solid var(--ink);width:14px;height:14px;border-radius:50%"></i>'+esc(t("tlEvent"))+'</span></div>'+
 '<div class="tl-wrap" id="tlwrap"><div class="tl" style="width:'+(W+40)+'px"><div class="axis">'+ticks+'</div><div class="evrow">'+dots+'</div>'+lanes+'</div></div>'+
 '<p class="small muted">'+esc(t("year"))+': '+esc(t("tlAM"))+' · <span class="civ">−1813</span> = 1813 '+esc(t("tlBCE"))+'</p>'+
 '<div class="undated"><h2>'+esc(t("tlUndated"))+'</h2><div class="chips">'+und.map(c=>chip(c)).join("")+'</div></div>'+
 '<h2>'+esc(t("tlHist"))+'</h2><p class="note">'+esc(t("tlHistTxt"))+'</p>'}

let treeP=null;function treeParasha(){return D.parachiot.find(p=>p.id===treeP)||latestParasha()}
function renderPeople(){const full=D.characters.filter(c=>c.status==="full"),link=D.characters.filter(c=>c.status!=="full");
 const card=c=>'<button class="pcard'+(c.status!=="full"?' link':'')+'" data-open="'+c.id+'">'+avatar(c)+'<b>'+esc(nm(c))+'</b><span>'+esc(L==="he"?c.fr:c.he)+'</span>'+(c.status!=="full"?'<br><span class="small">'+esc(t("linkOnly"))+'</span>':'')+'</button>';
 const tp=treeParasha(),tr=D.trees.filter(x=>x.parasha===tp.id);
 $("#s-people").innerHTML='<h1>'+esc(t("peopleTitle"))+'</h1><p class="lead">'+esc(t("peopleLead"))+'</p><div class="grid">'+full.map(card).join("")+link.map(card).join("")+'</div><h2>'+esc(t("trees"))+'</h2><p class="muted">'+esc(t("treeBy"))+'</p><div class="chips" style="margin-bottom:14px">'+[...D.parachiot].sort((a,b)=>a.order-b.order).map(p=>'<button class="chip'+(p.id===tp.id?' self':'')+'" data-treep="'+p.id+'">📖 '+esc(p[L])+'</button>').join("")+'</div>'+tr.map(tr=>'<h3>'+esc(tr[L])+'</h3><div class="tree-wrap"><div class="tree" data-tree="'+tr.id+'">'+tr.rows.map(r=>'<div class="trow">'+r.map(g=>'<div class="tgroup">'+g.map(id=>tnode(byId[id],false,!byId[id].parachiot.includes(tp.id))).join("")+'</div>').join("")+'</div>').join("")+'</div></div><p class="small muted">'+esc(tr.note[L])+' '+esc(t("treeDim"))+'</p>').join("");
 requestAnimationFrame(()=>document.querySelectorAll(".tree").forEach(drawLines))}
function tnode(c,cur,off){return '<button class="tnode'+(cur?' cur':'')+(off?' off':'')+'" data-open="'+c.id+'" data-node="'+c.id+'">'+avatar(c)+esc(nm(c))+'</button>'}
function drawLines(tree){tree.querySelector("svg.lines")?.remove();const box=tree.getBoundingClientRect(),nodes={};tree.querySelectorAll("[data-node]").forEach(n=>{const r=n.querySelector(".av").getBoundingClientRect();nodes[n.dataset.node]={x:r.left+r.width/2-box.left,y:r.top+r.height/2-box.top,t:r.top-box.top,b:r.bottom-box.top}});
 let p="";const done={};
 Object.keys(nodes).forEach(id=>{const c=byId[id];
  spousesOf(c).forEach(s=>{if(!nodes[s])return;const k=[id,s].sort().join();if(done[k])return;done[k]=1;p+='<line x1="'+nodes[id].x+'" y1="'+nodes[id].y+'" x2="'+nodes[s].x+'" y2="'+nodes[s].y+'" stroke="#e08a5b" stroke-width="3" stroke-dasharray="6 5"/>'});
  const ps=ids(c.parents).filter(x=>nodes[x]);if(!ps.length)return;const px=ps.reduce((a,x)=>a+nodes[x].x,0)/ps.length,py=Math.max(...ps.map(x=>nodes[x].b))+2,my=(py+nodes[id].t)/2;
  p+='<path d="M'+px+' '+py+'V'+my+'H'+nodes[id].x+'V'+(nodes[id].t-2)+'" fill="none" stroke="#6546cc" stroke-width="3"/>'});
 tree.insertAdjacentHTML("afterbegin",'<svg class="lines" aria-hidden="true">'+p+'</svg>')}

/* ---------- fiche ---------- */
function openChar(id,tab){const c=byId[id];if(!c)return;curChar=c;curTab=tab&&TABS.includes(tab)?tab:"who";const dlg=$("#fiche");
 $("#fav").outerHTML=avatar(c,"lg").replace('<span class="av lg"','<span class="av lg" id="fav"');
 $("#fname").textContent=nm(c);$("#falt").textContent=(L==="he"?c.fr:c.he)+(c.alt?" · "+c.alt[L]:"");
 const lbl={who:"t1",family:"t2",story:"t3",where:"t4",learn:"t5",quiz:"t6"};const sub={who:"Qui suis-je ?",family:"Ma famille",story:"Mon histoire",where:"Où suis-je ?",learn:"Apprendre",quiz:"Quiz"},subHe={who:"מִי אֲנִי?",family:"הַמִּשְׁפָּחָה שֶׁלִּי",story:"הַסִּפּוּר שֶׁלִּי",where:"אֵיפֹה אֲנִי?",learn:"מָה לוֹמְדִים",quiz:"חִידוֹן"};
 const avail=c.status==="full"?TABS:["who","family"];
 $("#ftabs").innerHTML=avail.map(k=>'<button role="tab" data-ftab="'+k+'" aria-selected="'+(k===curTab)+'">'+esc(T.he[lbl[k]])+'<small>'+esc(T.fr[lbl[k]])+'</small></button>').join("");
 if(!avail.includes(curTab))curTab="who";renderTab();if(!dlg.open)dlg.showModal();history.replaceState(null,"","#p="+id)}
function renderTab(){const c=curChar,b=$("#fbody");document.querySelectorAll("[data-ftab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.ftab===curTab));b.scrollTop=0;
 if(curTab==="who"){let h='<p class="story">'+esc(c.bio[L])+'</p>';
  ["nameNote","identityNote","parentsNote"].forEach(k=>{if(c[k])h+='<p class="note">'+srcBadge(c[k].src)+esc(c[k][L])+(c[k].source?' <span class="small muted">('+esc(c[k].source[L])+')</span>':'')+(c[k].ref?' <a href="'+sefaria(c[k].ref)+'" target="_blank" rel="noopener" class="small">'+esc(fmtRef(c[k].ref))+'</a>':'')+'</p>'});
  if(c.life&&(c.life.born!=null||c.life.age)){h+='<p class="note">'+srcBadge(c.life.src)+(c.life.born!=null?esc(t("born"))+': '+yr(c.life.born)+' · '+civ(c.life.born)+' · ':'')+(c.life.died?esc(t("died"))+': '+yr(c.life.died)+' · '+civ(c.life.died)+' · ':'')+(c.life.age?esc(t("age"))+': '+c.life.age+(c.life.ageRef?' (<a href="'+sefaria(c.life.ageRef)+'" target="_blank" rel="noopener">'+esc(fmtRef(c.life.ageRef))+'</a>)':''):'')+(c.life.note?'<br><span class="small">'+esc(c.life.note[L])+'</span>':'')+'</p>'}
  if(c.historical)h+='<p class="small muted">'+esc(t("tlHist"))+': '+esc(c.historical[L])+'</p>';
  b.innerHTML=h;return}
 if(curTab==="family"){const row=(k,list)=>list.length?'<div><h4>'+esc(t(k))+'</h4><div class="chips">'+list.map(id=>chip(byId[id])).join("")+'</div></div>':"";
  const kids=childrenOf(c.id).map(x=>x.id);let h='<div class="fam">'+row("parents",ids(c.parents))+'<div><h4>'+esc(t("me"))+'</h4><div class="chips">'+chip(c,true)+'</div></div>'+row("spouses",spousesOf(c))+row("siblings",siblingsOf(c))+row("children",kids);
  if(c.otherChildren)h+='<div><h4>'+esc(t("children"))+'</h4><p class="note">'+srcBadge("torah")+esc(c.otherChildren[L])+' · <a href="'+sefaria(c.otherChildren.ref)+'" target="_blank" rel="noopener">'+esc(fmtRef(c.otherChildren.ref))+'</a></p></div>';
  const rel=[...(c.parents||[]),...(c.spouses||[]),...(c.siblings||[])];if(rel.length)h+='<p class="small muted">'+rel.map(r=>esc(nm(byId[r.id]))+' · <a href="'+sefaria(r.ref)+'" target="_blank" rel="noopener">'+esc(fmtRef(r.ref))+'</a>').join(" | ")+'</p>';
  b.innerHTML=h+'</div>';return}
 if(curTab==="story"){const p=D.parachiot.find(x=>c.parachiot.includes(x.id));let v=c.video?'<video controls playsinline preload="none" src="'+esc(c.video)+'" style="width:100%;border-radius:20px"></video>':'<div class="video"><div>'+avatar(c,"md")+'<b>'+esc(t("videoSoon"))+'</b><span class="small">'+esc(t("videoTxt"))+'</span>'+(p?'<br><br><a class="cta" href="'+esc(p.episodes)+'">'+esc(t("readEp"))+'</a>':'')+'</div></div>';
  b.innerHTML=v+'<h3>'+esc(t("moments"))+'</h3><ul class="refs">'+(c.events||[]).map(e=>'<li>'+(e.am!=null?'<b>'+yr(e.am)+'</b> <span class="small muted">'+civ(e.am)+'</span> · ':'')+esc(e[L])+' <a class="small" href="'+sefaria(e.ref)+'" target="_blank" rel="noopener">'+esc(fmtRef(e.ref))+'</a>'+(e.datesrc==="midrash"?' <span class="src midrash">'+esc(t("year"))+': '+esc(D.sources.midrash[L])+'</span>':'')+'</li>').join("")+'</ul>';return}
 if(curTab==="where"){const refs=new Map();const add=r=>{if(r)refs.set(r,1)};(c.events||[]).forEach(e=>add(e.ref));(c.parents||[]).forEach(e=>add(e.ref));(c.spouses||[]).forEach(e=>add(e.ref));(c.lessons||[]).forEach(e=>add(e.ref));if(c.life)add(c.life.ageRef);
  const sorted=[...refs.keys()].sort((a,b)=>{const n=r=>r.split(/[.\-]/).slice(1,3).map(Number);const[x1,y1]=n(a),[x2,y2]=n(b);return x1-x2||y1-y2});
  b.innerHTML='<h3>'+esc(t("inParachiot"))+'</h3><div class="chips">'+c.parachiot.map(id=>{const p=D.parachiot.find(x=>x.id===id);return p?'<a class="chip" href="'+esc(p.episodes)+'">📖 '+esc(p[L])+' <span class="small muted">'+esc(p.ref[L])+'</span></a>':""}).join("")+'</div><h3>'+esc(t("refs"))+'</h3><ul class="refs">'+sorted.map(r=>'<li><b>'+esc(fmtRef(r))+'</b> · <a href="'+sefaria(r)+'" target="_blank" rel="noopener">'+esc(t("open"))+'</a></li>').join("")+'</ul>';return}
 if(curTab==="learn"){b.innerHTML=(c.lessons||[]).map(x=>'<div class="lesson">'+srcBadge(x.src)+(x.source?'<span class="small muted">'+esc(x.source[L])+'</span>':'')+'<p style="margin:8px 0">'+esc(x[L])+'</p>'+(x.ref?'<a class="ref" href="'+sefaria(x.ref)+'" target="_blank" rel="noopener">'+esc(fmtRef(x.ref))+'</a>':'')+'</div>').join("");return}
 if(curTab==="quiz")startQuiz()}

let qs={i:0,ok:0,lock:false};
function startQuiz(){qs={i:0,ok:0,lock:false};drawQ()}
function drawQ(){const c=curChar,b=$("#fbody"),Q=c.quiz;if(qs.i>=Q.length){const best=Math.max(qs.ok,(store("quiz:"+c.id)||0));store("quiz:"+c.id,best);
  b.innerHTML='<div class="stars">'+"⭐".repeat(qs.ok)+"☆".repeat(Q.length-qs.ok)+'</div><h3 style="text-align:center">'+esc(qs.ok>=4?t("bravo"):"")+' '+esc(t("score"))+' '+qs.ok+' '+esc(t("of"))+' '+Q.length+'</h3><p style="text-align:center"><button class="cta" id="qagain">'+esc(t("again"))+'</button></p>';$("#qagain").onclick=startQuiz;return}
 const q=Q[qs.i];b.innerHTML='<div class="qbar">'+Q.map((_,k)=>'<i class="'+(k<qs.i?'done':'')+'"></i>').join("")+'</div><div class="small muted">'+esc(t("qOf"))+' '+(qs.i+1)+' '+esc(t("of"))+' '+Q.length+(q.src==="midrash"?' · '+srcBadge("midrash"):'')+'</div><div class="q">'+esc(q.q[L])+'</div><div class="opts">'+q.options.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o[L])+'</button>').join("")+'</div><div class="feedback" id="fb" aria-live="polite"></div>';qs.lock=false}
function answer(k){if(qs.lock)return;qs.lock=true;const q=curChar.quiz[qs.i],right=k===q.answer;if(right)qs.ok++;
 document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;const n=+o.dataset.k;if(n===q.answer)o.classList.add("ok");else if(n===k)o.classList.add("no")});
 $("#fb").innerHTML=(right?esc(t("right")):esc(t("wrong"))+' '+esc(q.options[q.answer][L]))+' · <a href="'+sefaria(q.ref)+'" target="_blank" rel="noopener" class="small">'+esc(fmtRef(q.ref))+'</a><br><button class="cta" id="qnext" style="margin-top:12px">'+esc(t("next"))+'</button>';$("#qnext").onclick=()=>{qs.i++;drawQ()};$("#qnext").focus()}

/* ---------- routing & language ---------- */
function show(tab){["week","timeline","people"].forEach(k=>{$("#s-"+k).hidden=k!==tab;document.querySelector('[data-tab="'+k+'"]').setAttribute("aria-current",k===tab?"page":"false")});if(tab==="people")requestAnimationFrame(()=>document.querySelectorAll(".tree").forEach(drawLines))}
function route(){const h=location.hash.slice(1);if(h.startsWith("p=")){const id=h.slice(2);if(!$("#fiche").open||!curChar||curChar.id!==id)openChar(id);return}show(["week","timeline","people"].includes(h)?h:"week")}
function setLang(l){L=l;store("encLang",l);document.documentElement.lang=l;document.documentElement.dir=l==="he"?"rtl":"ltr";document.title=l==="he"?"דמויות בתורה · מסע בפרשה":"Personnages de la Torah · Voyage dans la paracha";
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 $("#foot").textContent=t("foot");renderWeek();renderTimeline();renderPeople();if($("#fiche").open&&curChar)openChar(curChar.id,curTab)}

document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){e.preventDefault();openChar(o.dataset.open,o.dataset.tab);return}
 const f=e.target.closest("[data-ftab]");if(f){curTab=f.dataset.ftab;renderTab();return}
 const a=e.target.closest(".opt");if(a){answer(+a.dataset.k);return}
 const tpb=e.target.closest("[data-treep]");if(tpb){treeP=tpb.dataset.treep;renderPeople();return}
 const lg=e.target.closest("[data-lang]");if(lg)setLang(lg.dataset.lang)});
$("#fclose").onclick=()=>$("#fiche").close();
$("#fiche").addEventListener("close",()=>{if(location.hash.startsWith("#p="))history.replaceState(null,"","#people");route()});
$("#fiche").addEventListener("click",e=>{if(e.target===$("#fiche"))$("#fiche").close()});
addEventListener("hashchange",route);
addEventListener("resize",()=>document.querySelectorAll(".tree").forEach(drawLines));

function boot(data){D=data;D.characters.forEach(c=>byId[c.id]=c);const saved=store("encLang");setLang(saved==="fr"?"fr":"he");route()}
if(window.ENC_DATA)boot(window.ENC_DATA);else fetch("data/personnages.json").then(r=>r.json()).then(boot).catch(()=>{$("#s-week").innerHTML='<p class="note">⚠️ data/personnages.json</p>'});
</script>
